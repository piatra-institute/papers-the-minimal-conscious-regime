  passage: 'The three agents differ in mechanism and in the relation between responsiveness and experience: dexmedetomidine
    leaves many participants arousable and reporting experience [@radek2018], ketamine produces unresponsiveness
    with vivid dreams and wake-like complexity, and propofol at deeper levels leaves neither [@sarasso2015].'
  evidence:
