- id: def-R
  kind: definition
  passage: The returned part is $P_{X(i)}(\bar A^\tau - \bar A_{\rm in}^\tau) e_i$, because $\bar A_{\rm in}^\tau
    e_i$ collects every path that never leaves $X(i)$.
  rationale: Definition of the return component; R is its energy over the out-of-region energy (equation in section
    3.2).
- id: prop-R
  kind: interpretation
  passage: '**Proposition 1.** If the region graph of $A$ (an edge from $X$ to $Y \neq X$ when some $A_{yx} \neq
    0$ with $x \in X$, $y \in Y$) is acyclic, then $R = 0$.'
  rationale: Proved in section 3.2 by path counting; checked numerically (/estimators/R_acyclic_max = 0, /checks/R_zero_on_acyclic).
- id: def-Q
  kind: definition
  passage: 'Integration is the share of response energy outside the pulsed region and differentiation is the dissimilarity
    of the responses to different regions, each pair compared on the units outside both pulsed regions:'
  rationale: Definition of I_Q, D_Q and Q = I_Q D_Q (equation in section 3.3).
- id: prop-T
  kind: interpretation
  passage: '**Proposition 2.** For an exogenous input, $T$ depends on $A$ alone.'
  rationale: 'Proved in section 3.4: conditioning on the input path leaves the autonomous process; checked numerically
    (/checks/buffer_T_independent_of_input).'
- id: prop-S
  kind: interpretation
  passage: '**Proposition 3.** For $Z_{t+1} = A Z_t + \eta_t$ with nonsingular innovation covariance, $Y = LZ$ has
    zero dynamical dependence if and only if $L A = \tilde A L$ for some $\tilde A \in \mathbb{R}^{n \times n}$,
    that is, if and only if the row space of $L$ is invariant under $A^\top$.'
  rationale: Proved in section 3.5 by matching innovation coefficients; checked numerically by invariance residuals
    and transfer entropy (/estimators/di).
- id: def-S
  kind: definition
  passage: We take the macro of dimension $n$ spanned by the $n$ slowest modes, the coarsest description in time,
    and measure whether it persists.
  rationale: 'Definition of the S estimator: slowest left-invariant subspaces from K = 6 windows of 4000 samples,
    chance-corrected overlap, maximum over n <= 12.'
- id: asm-threshold
  kind: assumption
  passage: An invariant passes when its value is at least half of its value in a reference network.
  rationale: Convention; the atlas reports the interval of fractions (0.076 to 0.645) over which its conclusion
    holds.
