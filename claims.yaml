- id: src-pci
  kind: source
  passage: The perturbational complexity index (PCI) measures how complex the cortical response to a transcranial
    magnetic pulse is, after binarizing the response against baseline and compressing it [@casali2013].
  evidence:
    citation_id: casali2013
    locator: Abstract
    verification_note: 'Crossref summary: a theory-derived index quantifying the complexity of the brain response
      to a stimulus (TMS-EEG) measures the level of consciousness across wakefulness, sleep, anaesthesia and brain
      injury.'
    verified: true
- id: src-casarotto
  kind: source
  passage: Validated on a benchmark of 150 healthy and brain-injured subjects who could report, its cutoff separated
    conscious from unconscious conditions without error, and it detected 94.7% of 38 patients in a minimally conscious
    state, while 9 of 43 patients in a vegetative state scored above it [@casarotto2016].
  evidence:
    citation_id: casarotto2016
    locator: Abstract
    verification_note: 'Abstract: benchmark of 150 healthy controls and communicative brain-injured subjects; empirical
      cutoff with 100% sensitivity and specificity; 94.7% sensitivity for 38 MCS patients; 9 of 43 VS patients with
      high PCI.'
    verified: true
- id: src-sarasso
  kind: source
  passage: In 18 volunteers, propofol produced a low-amplitude slow wave that stayed near the stimulated site, xenon
    a high-amplitude slow wave that spread over the cortex in a stereotyped pattern, and ketamine a complex, wake-like
    response; after propofol and xenon participants reported nothing, after ketamine long, vivid dreams [@sarasso2015].
  evidence:
    citation_id: sarasso2015
    locator: Abstract
    verification_note: 'Abstract: 18 volunteers; propofol low-amplitude local slow wave with low complexity; xenon
      high-amplitude global stereotypical slow wave with low complexity; ketamine wake-like complex pattern; no
      experience reported after propofol and xenon, long vivid dreams after ketamine.'
    verified: true
- id: src-massimini
  kind: source
  passage: The loss of propagation under propofol repeats what non-rapid-eye-movement sleep does to the same probe
    [@massimini2005].
  evidence:
    citation_id: massimini2005
    locator: Abstract
    verification_note: 'Abstract: during NREM sleep the initial TMS response was stronger but rapidly extinguished
      and did not propagate beyond the stimulation site.'
    verified: true
- id: src-radek
  kind: source
  passage: Of 93 interviews conducted during target-controlled infusion of dexmedetomidine or propofol, 84% contained
    experiences from the unresponsive period (90% under dexmedetomidine, 74% under propofol), most of them internally
    generated [@radek2018].
  evidence:
    citation_id: radek2018
    locator: Abstract
    verification_note: 'Abstract: of 93 interviews, 84% included experiences from unresponsive periods (dexmedetomidine
      90%, propofol 74%); internally generated experiences (dreaming) in 86% of reports from unresponsive periods.'
    verified: true
- id: src-sikka
  kind: source
  passage: Across 157 studies and 87,866 participants, dream recall after anaesthesia ran from 40% to 80% in experimental
    settings and from 3% to 8% in large clinical trials, and recall was unrelated to intraoperative awareness [@sikka2026].
  evidence:
    citation_id: sikka2026
    locator: Abstract
    verification_note: 'Abstract: 157 studies (1921-2024), 87,866 participants; recall often 40%-80% experimental,
      3%-8% clinical trials; recall not associated with intraoperative awareness.'
    verified: true
- id: src-siclari
  kind: source
  passage: In sleep, awakenings with and without reported experience differ in posterior low-frequency activity,
    and during non-rapid-eye-movement sleep that difference predicts the report in real time [@siclari2017].
  evidence:
    citation_id: siclari2017
    locator: Abstract
    verification_note: 'Abstract: reports of dream experience in NREM and REM associated with local decreases in
      posterior low-frequency activity; monitoring the posterior hot zone in real time predicted reports during
      NREM sleep.'
    verified: true
- id: src-maschke
  kind: source
  passage: Distance from avalanche criticality and from the edge of chaos in resting electroencephalography (EEG)
    predicts individual PCI under propofol, xenon and ketamine [@maschke2024], and has been proposed as the organizing
    variable for consciousness [@algom2026].
  evidence:
    citation_id: maschke2024
    locator: Abstract
    verification_note: 'Abstract: propofol, xenon, ketamine; unconsciousness characterized by distancing from avalanche
      criticality and the edge of chaos; resting-state dynamical properties predict individual PCI.'
    verified: true
- id: src-milinkovic
  kind: source
  passage: Dynamical independence, a measure of how far a macroscopic variable evolves on its own, rises but fluctuates
    under propofol and xenon and falls with partial preservation of structure under ketamine [@milinkovic2026].
  evidence:
    citation_id: milinkovic2026
    locator: Abstract
    verification_note: 'Abstract: propofol and xenon show more emergent but highly variable dynamic structure; ketamine
      reduced emergence with partial preservation of macroscopic structure.'
    verified: true
- id: src-breyton
  kind: source
  passage: A whole-brain model shows perturbational complexity only in a regime of high functional fluidity that
    can be read from spontaneous activity [@breyton2025].
  evidence:
    citation_id: breyton2025
    locator: Abstract
    verification_note: 'Abstract: perturbational complexity occurs only in a regime of high brain fluidity characterized
      by metrics of spontaneous activity; validated against PCI in 15 subjects.'
    verified: true
- id: src-bayne
  kind: source
  passage: Conceptual work has argued that global states are points in a space of several dimensions, ill described
    by a single level [@bayne2016; @birch2020], and that tests for consciousness need a classification and a validation
    strategy of their own [@bayne2024].
  evidence:
    citation_id: bayne2016
    locator: Abstract
    verification_note: 'Abstract: the levels-based framework for global states is untenable; a multidimensional
      account is developed. Birch et al. 2020: consciousness profiles; Bayne et al. 2024: C-tests, classification
      and validation strategies.'
    verified: true
- id: def-regime
  kind: definition
  passage: A system is in the minimal conscious regime when, at once, causal influence returns between its regions
    ($R$), its responses to perturbation are widespread and differ by site ($Q$), its own dynamics hold information
    over time ($T$), and it has a macroscopic organization that persists ($S$).
  rationale: Definition of the regime as the conjunction of the four invariants; operationalized by the estimators
    of section 3 and the thresholds of section 3.6.
- id: asm-regime
  kind: assumption
  passage: The regime is a hypothesis of necessity for each invariant and joint sufficiency for the four; it is
    testable only if each invariant has an estimator, if no invariant is implied by the others, and if the cost
    of testing a conjunction is known.
  rationale: States the hypothesis under test; the paper does not assert it (section 7).
- id: src-suzuki
  kind: source
  passage: In mice, three anaesthetics decouple the apical dendrites of layer 5 pyramidal neurons, where much cortico-cortical
    feedback arrives, from their cell bodies [@suzuki2020; @larkum2013], a mechanism that would block feedback while
    sparing feedforward signalling [@suzuki2020; @aru2020].
  evidence:
    citation_id: suzuki2020
    locator: Abstract
    verification_note: 'Abstract: three anaesthetics disrupt signalling along apical dendrites of layer 5 pyramidal
      neurons in mice; anaesthesia disrupts feedback signalling with feedforward signalling relatively unchanged.
      Larkum 2013 and Aru et al. 2020 for feedback onto apical dendrites.'
    verified: true
- id: src-redinbaugh
  kind: source
  passage: In macaques, consciousness tracks deep-layer neurons that feed back to superficial layers under the drive
    of the central lateral thalamus, across anaesthetics and sleep [@redinbaugh2020].
  evidence:
