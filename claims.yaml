- id: int-timing
  kind: interpretation
  passage: A requirement that all four invariants fail before experience is lost is stronger than necessity implies.
  rationale: 'Logic of a conjunction: the regime is lost at the first failure; necessity of each invariant constrains
    only that first failure.'
- id: int-corr
  kind: interpretation
  passage: Correlated errors make the conjunction cheaper, because the four tests then fail together, and they make
    it less informative for the same reason.
  rationale: 'Read from the margin curve (/statistics/margin_curve): required margin decreases with error correlation.'
- id: src-mcr-drugs
