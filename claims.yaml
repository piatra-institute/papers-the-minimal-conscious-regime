  evidence:
    citation_id: barnett2023
    locator: Abstract
    verification_note: 'Abstract: dynamical independence as a macroscopic process with its own dynamical laws; quantified
      by an information-theoretic dynamical dependence measure; explicit for linear systems.'
    verified: true
